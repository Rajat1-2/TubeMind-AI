<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 520px;
      margin: 0;
      padding: 14px;
      font-family: Inter, Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 78% 12%, rgba(255, 64, 219, 0.34), transparent 30%),
        radial-gradient(circle at 18% 0%, rgba(0, 229, 255, 0.22), transparent 28%),
        linear-gradient(135deg, #20104c 0%, #35106c 48%, #5a1394 100%);
    }

    .shell {
      position: relative;
      overflow: hidden;
      min-height: 492px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background: rgba(21, 10, 53, 0.74);
      box-shadow: 0 18px 44px rgba(10, 0, 35, 0.45);
    }

    .shell::after {
      content: "";
      position: absolute;
      top: 18px;
      right: -26px;
      width: 130px;
      height: 130px;
      border: 1px solid rgba(0, 229, 255, 0.18);
      border-radius: 28px;
      transform: rotate(18deg);
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.12), rgba(255, 64, 219, 0.08));
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 1;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #63f5ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.14;
    }

    .accent {
      display: block;
      color: #ff48d7;
    }

    .subtitle {
      max-width: 215px;
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 13px;
      line-height: 1.45;
    }

    .robot-mark {
      position: absolute;
      top: 24px;
      right: 18px;
      z-index: 1;
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(145deg, #ffffff, #b6efff);
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.28);
    }

    .robot-mark::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 25px;
      width: 46px;
      height: 25px;
      border-radius: 14px;
      background: #1d1354;
      box-shadow: inset 0 0 10px rgba(255, 72, 215, 0.42);
    }

    .robot-mark::after {
      content: "";
      position: absolute;
      left: 25px;
      top: 34px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #63f5ff;
      box-shadow: 18px 0 0 #ff48d7;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(90deg, #ff3dcc, #7c4dff);
      box-shadow: 0 10px 22px rgba(255, 61, 204, 0.28);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .panel {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
    }

    .panel-title {
      margin: 0 0 8px;
      color: #63f5ff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    #summaryOutput {
      max-height: 112px;
      overflow-y: auto;
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .chat-log {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 150px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .message {
      max-width: 92%;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .message.ai {
      align-self: flex-start;
      background: rgba(99, 245, 255, 0.13);
      border: 1px solid rgba(99, 245, 255, 0.2);
    }

    .message.user {
      align-self: flex-end;
      background: rgba(255, 72, 215, 0.16);
      border: 1px solid rgba(255, 72, 215, 0.24);
    }

    .chat-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #questionInput {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 10px;
      color: #ffffff;
      outline: none;
      background: rgba(0, 0, 0, 0.22);
    }

    #questionInput::placeholder {
      color: rgba(255, 255, 255, 0.52);
    }

    #sendBtn {
      width: 68px;
      padding: 10px;
    }

    .status {
      min-height: 17px;
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="robot-mark" aria-hidden="true"></div>

    <section class="brand">
      <p class="eyebrow">VidMind AI</p>
      <h1>YouTube video <span class="accent">chat assistant</span></h1>
      <p class="subtitle">Summarize in seconds, Chat with AI, and escape Tutorial Hell.</p>
    </section>

    <button id="summarizeBtn">Summary</button>
    <div id="status" class="status"></div>

    <section class="panel">
      <p class="panel-title">Summary</p>
      <div id="summaryOutput">No summary yet.</div>
    </section>

    <section class="panel">
      <p class="panel-title">Chat</p>
      <div id="chatLog" class="chat-log">
        <div class="message ai">Summarize a video first, then ask me anything about it.</div>
      </div>
      <form id="chatForm" class="chat-form">
        <input id="questionInput" type="text" placeholder="Ask about this video..." disabled>
        <button id="sendBtn" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
