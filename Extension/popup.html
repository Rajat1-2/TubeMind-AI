<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeMind AI</title>

  <style>
    :root {
      --bg: #09090d;
      --surface: #111117;
      --surface-2: #16161e;
      --surface-3: #1d1d27;

      --border: rgba(255, 255, 255, 0.075);
      --border-strong: rgba(255, 255, 255, 0.14);

      --text: #f4f4f7;
      --text-soft: #cfcfd8;
      --muted: #9a9aa6;
      --muted-2: #6c6c78;

      --red: #ff2d55;
      --red-deep: #e0003c;
      --violet: #8b5cf6;
      --violet-deep: #6d3df0;
      --green: #34d399;

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      height: 600px;
      overflow: hidden;

      color: var(--text);
      background:
        radial-gradient(circle at 105% -5%, rgba(139, 92, 246, 0.16), transparent 38%),
        radial-gradient(circle at -5% 15%, rgba(255, 45, 85, 0.10), transparent 34%),
        var(--bg);

      font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    svg {
      display: block;
      flex-shrink: 0;
    }

    .app {
      height: 100%;
      padding: 12px;
    }

    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;

      background: rgba(17, 17, 23, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;

      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 14px 16px;

      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;
      color: #fff;

      background: linear-gradient(135deg, #ff3d66 0%, #d6003a 55%, #8b2bd9 130%);
      box-shadow:
        0 6px 18px rgba(255, 45, 85, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .brand-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-name {
      display: flex;
      align-items: center;
      gap: 6px;

      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1;
    }

    .brand-badge {
      padding: 2px 6px;

      border-radius: 6px;

      color: #d9c9ff;
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.28);

      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 6px;

      padding: 5px 10px;

      border-radius: 999px;

      color: #86efc3;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.18);

      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .online-dot {
      position: relative;

      width: 6px;
      height: 6px;

      border-radius: 50%;
      background: var(--green);
    }

    .online-dot::after {
      content: "";
      position: absolute;
      inset: -3px;

      border-radius: 50%;
      border: 1px solid var(--green);

      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }


    /* =========================
       SUMMARY SECTION
    ========================= */

    .summary-section {
      padding: 14px 16px 0;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 10px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;

      color: var(--text);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.1px;
    }

    .icon-chip {
      width: 24px;
      height: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 7px;

      color: #c4b0ff;
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .tag {
      padding: 3px 8px;

      border-radius: 999px;

      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);

      font-size: 9.5px;
      font-weight: 600;
    }


    /* =========================
       GENERATE BUTTON
    ========================= */

    #summarizeBtn {
      position: relative;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 12px 14px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;

      color: #fff;
      background: linear-gradient(135deg, #ff3d66, #d6003a);

      font-family: inherit;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.1px;

      cursor: pointer;
      overflow: hidden;

      box-shadow:
        0 10px 26px rgba(255, 45, 85, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);

      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    #summarizeBtn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;

      width: 40%;
      height: 100%;

      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      transform: skewX(-20deg);
      transition: left 0.55s ease;
    }

    #summarizeBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow:
        0 14px 32px rgba(255, 45, 85, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    #summarizeBtn:hover:not(:disabled)::after {
      left: 130%;
    }

    #summarizeBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #summarizeBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      min-height: 18px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      margin: 9px 0 10px;

      color: var(--muted);
      font-size: 10.5px;
      font-weight: 500;
      text-align: center;
    }

    .status::before {
      content: "";

      width: 5px;
      height: 5px;

      border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.8);
    }


    /* =========================
       SUMMARY CARD
    ========================= */

    .summary-card {
      min-height: 96px;
      max-height: 136px;

      padding: 12px 13px;

      overflow-y: auto;

      border-radius: var(--radius);
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 40%),
        var(--surface-2);
    }

    #summaryOutput {
      color: var(--text-soft);

      font-size: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }


    /* =========================
       CHAT SECTION
    ========================= */

    .chat-section {
      flex: 1;
      min-height: 0;

      display: flex;
      flex-direction: column;

      margin: 14px 16px 16px;

      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);

      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 12px;

      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 12px;
      font-weight: 750;
    }


    /* =========================
       CHAT MESSAGES
    ========================= */

    .chat-log {
      flex: 1;
      min-height: 0;

      display: flex;
      flex-direction: column;
      gap: 10px;

      padding: 12px;

      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 90%;

      padding: 9px 12px;

      border-radius: 13px;

      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;

      animation: messageIn 0.2s ease-out;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.ai {
      align-self: flex-start;

      color: var(--text-soft);
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.user {
      align-self: flex-end;

      color: #fff;
      background: linear-gradient(135deg, #7c4dff, #5b34d6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom-right-radius: 4px;

      box-shadow: 0 6px 16px rgba(109, 61, 240, 0.25);
    }


    /* =========================
       CHAT INPUT
    ========================= */

    .chat-form {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 10px;

      border-top: 1px solid var(--border);
      background: #0e0e13;
    }

    #questionInput {
      flex: 1;
      min-width: 0;
      height: 38px;

      padding: 0 13px;

      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;

      color: #fff;
      background: var(--surface-2);

      font-family: inherit;
      font-size: 12px;

      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    #questionInput::placeholder {
      color: var(--muted-2);
    }

    #questionInput:focus {
      border-color: rgba(139, 92, 246, 0.6);
      background: #1a1a23;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    #questionInput:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #sendBtn {
      width: 38px;
      height: 38px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 11px;

      color: #fff;
      background: linear-gradient(135deg, #8b5cf6, #6d3df0);
      box-shadow: 0 6px 16px rgba(109, 61, 240, 0.35);

      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    #sendBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(109, 61, 240, 0.45);
    }

    #sendBtn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }


    /* =========================
       SCROLLBARS
    ========================= */

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #34343f;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4a4a57;
    }
  </style>
</head>


<body>

  <div class="app">
    <main class="shell">

      <!-- HEADER -->
      <header class="header">

        <div class="brand">
          <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
              <polygon points="7 4 20 12 7 20 7 4"></polygon>
            </svg>
          </div>

          <div class="brand-info">
            <div class="brand-name">TubeMind <span class="brand-badge">AI</span></div>
            <div class="brand-subtitle">YouTube summaries &amp; chat</div>
          </div>
        </div>

        <div class="online-status">
          <span class="online-dot"></span>
          AI Online
        </div>

      </header>


      <!-- SUMMARY -->
      <section class="summary-section">

        <div class="section-heading">
          <div class="section-title">
            <span class="icon-chip">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" x2="8" y1="13" y2="13"></line>
                <line x1="16" x2="8" y1="17" y2="17"></line>
              </svg>
            </span>
            Video Summary
          </div>

          <div class="tag">AI generated</div>
        </div>

        <button id="summarizeBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
          </svg>
          Generate Summary
        </button>

        <div id="status" class="status">Ready to analyze this video.</div>

        <div class="summary-card">
          <div id="summaryOutput">No summary yet. Open a YouTube video and click "Generate Summary".</div>
        </div>

      </section>


      <!-- CHAT -->
      <section class="chat-section">

        <div class="chat-header">
          <div class="chat-title">
            <span class="icon-chip">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </span>
            Ask about this video
          </div>

          <div class="tag">RAG powered</div>
        </div>

        <div id="chatLog" class="chat-log">
          <div class="message ai">Summarize the video first, then ask me anything about its content.</div>
        </div>

        <form id="chatForm" class="chat-form">
          <input
            id="questionInput"
            type="text"
            placeholder="Ask a question..."
            autocomplete="off"
            disabled
          >

          <button id="sendBtn" type="submit" aria-label="Send" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12 7-7 7 7"></path>
              <path d="M12 19V5"></path>
            </svg>
          </button>
        </form>

      </section>

    </main>
  </div>

  <script src="popup.js"></script>

</body>
</html>
